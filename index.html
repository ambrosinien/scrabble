<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solveur Expert</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f0f13;
            --surface: #18181f;
            --border: #2a2a36;
            --primary: #7c6af7;
            --primary-dim: rgba(124,106,247,0.15);
            --excl: #f97066;
            --excl-dim: rgba(249,112,102,0.12);
            --incl: #34d399;
            --incl-dim: rgba(52,211,153,0.12);
            --text: #e8e8f0;
            --muted: #6b6b80;
            --mono: 'DM Mono', monospace;
            --display: 'Syne', sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: var(--mono); background: var(--bg); color: var(--text); min-height: 100vh; padding: 24px 16px 60px; }
        header { max-width: 580px; margin: 0 auto 28px; }
        .logo { font-family: var(--display); font-size: 1.5rem; font-weight: 800; letter-spacing: -0.03em; color: white; }
        .logo span { color: var(--primary); }
        .status-bar { margin-top: 6px; font-size: 0.72rem; color: var(--muted); letter-spacing: 0.05em; }
        .dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--incl); margin-right: 6px; vertical-align: middle; }
        .card { max-width: 580px; margin: 0 auto; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 20px; }
        .tabs { display: flex; gap: 4px; background: var(--bg); padding: 4px; border-radius: 12px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 11px; border: none; background: transparent; cursor: pointer; border-radius: 9px; font-family: var(--display); font-weight: 700; font-size: 0.82rem; letter-spacing: 0.04em; color: var(--muted); transition: all 0.2s; }
        .tab-btn.active { background: var(--primary); color: white; }
        .field-label { font-size: 0.65rem; font-weight: 500; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; margin: 16px 0 6px 2px; }
        input { width: 100%; padding: 14px 16px; background: var(--bg); border: 1.5px solid var(--border); border-radius: 11px; font-family: var(--mono); font-size: 1.1rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text); outline: none; transition: border-color 0.2s, background 0.2s; }
        input:focus { border-color: var(--primary); background: var(--primary-dim); }
        input.input-motif:focus { border-color: var(--primary); }
        input.input-excl { border-color: var(--excl-dim); }
        input.input-excl:focus { border-color: var(--excl); background: var(--excl-dim); }
        input.input-incl { border-color: var(--incl-dim); }
        input.input-incl:focus { border-color: var(--incl); background: var(--incl-dim); }
        #resultats { margin-top: 24px; }
        .groupe-taille { margin-bottom: 16px; animation: fadeIn 0.2s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .label-taille { display: inline-block; font-family: var(--display); font-size: 0.68rem; font-weight: 800; letter-spacing: 0.1em; color: var(--primary); background: var(--primary-dim); padding: 3px 10px; border-radius: 20px; margin-bottom: 8px; }
        .count-badge { float: right; font-size: 0.65rem; color: var(--muted); font-weight: 500; margin-top: 2px; }
        .mots { background: var(--bg); border: 1px solid var(--border); padding: 14px; border-radius: 11px; line-height: 1.9; font-size: 0.95rem; letter-spacing: 0.05em; word-break: break-all; color: #c8c8dc; }
        .no-result { text-align: center; color: var(--muted); padding: 40px 20px; font-size: 0.85rem; letter-spacing: 0.05em; }
    </style>
</head>
<body>

<header>
    <div class="logo">Solveur<span>.</span></div>
    <div class="status-bar">
        <span class="dot"></span>
        <span>168 447 mots — prêt</span>
    </div>
</header>

<div class="card">
    <div class="tabs">
        <button class="tab-btn active" onclick="setMode('anagramme', this)">Anagrammes</button>
        <button class="tab-btn" onclick="setMode('motif', this)">Motifs Experts</button>
    </div>

    <div id="mainInputContainer">
        <div class="field-label" id="mainLabel">Vos lettres (+ joker *)</div>
        <input type="text" id="userInput" placeholder="Ex: AERTSU*" autocomplete="off" oninput="chercher()">
    </div>

    <div id="advancedFilters" style="display:none;">
        <div class="field-label">Lettres à exclure</div>
        <input type="text" id="exclInput" class="input-excl" placeholder="Ex: BENDT" oninput="chercher()">
        <div class="field-label">Lettres en main (pour les trous .)</div>
        <input type="text" id="inclInput" class="input-incl" placeholder="Ex: RRTO*" oninput="chercher()">
    </div>

    <div id="resultats"></div>
</div>

<script src="dictionnaire.js"></script>
<script>
    let modeActuel = 'anagramme';

    function setMode(mode, btn) {
        modeActuel = mode;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const advanced = document.getElementById('advancedFilters');
        const mainLabel = document.getElementById('mainLabel');
        const userInput = document.getElementById('userInput');
        if (mode === 'motif') {
            advanced.style.display = 'block';
            mainLabel.innerText = "Motif fixe (points pour les trous)";
            userInput.placeholder = "Ex: A..U.";
            userInput.classList.add('input-motif');
        } else {
            advanced.style.display = 'none';
            mainLabel.innerText = "Vos lettres (+ joker *)";
            userInput.placeholder = "Ex: AERTSU*";
            userInput.classList.remove('input-motif');
        }
        chercher();
    }

    function compter(str) {
        const c = {};
        for (let l of str) c[l] = (c[l] || 0) + 1;
        return c;
    }

    function peutFaireAnagramme(mot, mainStr) {
        const motC = compter(mot);
        const mainC = compter(mainStr.replace(/\*/g, ''));
        let jokers = (mainStr.match(/\*/g) || []).length;
        for (let l in motC) {
            let manque = motC[l] - (mainC[l] || 0);
            if (manque > 0) {
                if (jokers >= manque) jokers -= manque;
                else return false;
            }
        }
        return true;
    }

    function verifierMotifExpert(mot, motif, exclusions, main) {
        const regex = new RegExp("^" + motif.replace(/\./g, "[A-Z]") + "$");
        if (!regex.test(mot)) return false;
        if (exclusions) {
            // Lettres fixes déjà posées dans le motif (hors points)
            const lettresMotif = compter(motif.replace(/\./g, ''));
            const compteMot = compter(mot);
            for (let l of exclusions) {
                if (!mot.includes(l)) continue;
                // Occurrences dans le mot au-delà de celles déjà fixées par le motif
                const dansMotif = lettresMotif[l] || 0;
                const dansMot   = compteMot[l] || 0;
                if (dansMot > dansMotif) return false;
            }
        }
        if (main && main.trim() !== "") {
            const compteMot = compter(mot);
            const compteMain = compter(main.replace(/\*/g, ''));
            let jokers = (main.match(/\*/g) || []).length;
            for (let l in compteMain) {
                let besoin = compteMain[l];
                let possede = compteMot[l] || 0;
                if (possede < besoin) {
                    let manque = besoin - possede;
                    if (jokers >= manque) jokers -= manque;
                    else return false;
                }
            }
        }
        return true;
    }

    function chercher() {
        const input = document.getElementById('userInput').value.trim().toUpperCase();
        const excl  = document.getElementById('exclInput').value.trim().toUpperCase();
        const main  = document.getElementById('inclInput').value.trim().toUpperCase();
        const container = document.getElementById('resultats');
        if (input.length < 2) { container.innerHTML = ""; return; }

        let html = "";
        const longueurs = Object.keys(dictionnaireData).map(Number).sort((a, b) => b - a);

        if (modeActuel === 'anagramme') {
            longueurs.forEach(L => {
                if (L <= input.length) {
                    const trouves = dictionnaireData[L].filter(mot => peutFaireAnagramme(mot, input));
                    if (trouves.length > 0) html += genererHtml(L, trouves);
                }
            });
        } else {
            if (dictionnaireData[input.length]) {
                const trouves = dictionnaireData[input.length].filter(mot => verifierMotifExpert(mot, input, excl, main));
                if (trouves.length > 0) html += genererHtml(input.length, trouves);
            }
        }
        container.innerHTML = html || "<div class='no-result'>Aucun mot trouvé</div>";
    }

    function genererHtml(taille, liste) {
        return `<div class="groupe-taille">
            <span class="label-taille">${taille} lettres</span>
            <span class="count-badge">${liste.length} mot${liste.length > 1 ? 's' : ''}</span>
            <div class="mots">${liste.join(', ')}</div>
        </div>`;
    }
</script>
</body>
</html>
